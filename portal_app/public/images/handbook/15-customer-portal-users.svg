"7.5" fill="#7a6b4f" letter-spacing="1">ACCOUNT</text><rect x="20" y="527" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="536" class="t" font-size="10" fill="#b8ab92" font-weight="400">Profile</text><rect x="20" y="548" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="557" class="t" font-size="10" fill="#b8ab92" font-weight="400">Admin</text><rect x="196" y="34" width="764" height="52" fill="#fff"/><line x1="196" y1="86" x2="960" y2="86" stroke="#e6ded0" stroke-width="1"/><rect x="216" y="49" width="250" height="22" rx="11" fill="#faf7f2" stroke="#e6ded0"/><text x="232" y="64" class="t" font-size="9" fill="#8b7f6b">Search projects, teams, tasks, documents...</text><rect x="810" y="47" width="96" height="26" rx="13" fill="#c5a059"/><text x="858" y="64" class="t h" font-size="10" fill="#fff" text-anchor="middle">+ New Project</text><circle cx="928" cy="60" r="14" fill="#7a5f2c"/><text x="928" y="64.5" class="t h" font-size="11" fill="#fff" text-anchor="middle">A</text><rect x="216" y="98" width="724" height="70" rx="10" fill="#ffffff" stroke="#e6ded0"/><text x="236" y="124" class="t h" font-size="12" fill="#241c10">Customer</text><text x="236" y="146" class="t h" font-size="10.5" fill="#241c10">Customer A</text><text x="307.0" y="146" class="t mo" font-size="8.5" fill="#8b7f6b">CUST-0001</text><rect x="640" y="128" width="190" height="22" rx="7" fill="#fff" stroke="#e6ded0"/><text x="735.0" y="141.88" class="t h" font-size="8" fill="#7a5f2c" text-anchor="middle">Create customer (no duplicate name)</text><rect x="836" y="128" width="90" height="22" rx="7" fill="#fff" stroke="#e8b4ae"/><text x="881.0" y="141.88" class="t h" font-size="8" fill="#96271c" text-anchor="middle">Clear customer</text><rect x="216" y="180" width="724" height="382" rx="10" fill="#ffffff" stroke="#e6ded0"/><text x="236" y="206" class="t h" font-size="12" fill="#241c10">Customer portal users</text><rect x="816" y="192" width="104" height="24" rx="7" fill="#fff" stroke="#e6ded0"/><text x="868.0" y="207.24" class="t h" font-size="9" fill="#7a5f2c" text-anchor="middle">Invite new user</text><text x="236" y="228" class="t" font-size="8.5" fill="#8b7f6b">Everyone here can sign in to the portal and see this customer’s projects. One login can belong to several customers.</text><text x="236" y="241" class="t" font-size="8.5" fill="#8b7f6b">Remove from portal takes away this customer only; their other customers stay.</text><text x="236" y="266" class="t h" font-size="7.5" fill="#8b7f6b" letter-spacing=".6">PEOPLE WITH ACCESS</text><rect x="236" y="274" width="684" height="116" rx="9" fill="#fff" stroke="#e6ded0"/><text x="252" y="294" class="t h" font-size="10" fill="#241c10">Client One</text><text x="252" y="308" class="t" font-size="8.5" fill="#8b7f6b">client.one@example.com</text><text x="252" y="322" class="t" font-size="8.5" fill="#8b7f6b">Last signed in 28/09/2026, 10:15:00</text><rect x="674" y="292" width="104" height="26" rx="7" fill="#fff" stroke="#e6ded0"/><text x="726.0" y="308.24" class="t h" font-size="9" fill="#6b5f4d" text-anchor="middle">Reset password</text><rect x="786" y="292" width="118" height="26" rx="7" fill="#fff" stroke="#e8b4ae"/><text x="845.0" y="308.24" class="t h" font-size="9" fill="#96271c" text-anchor="middle">Remove from portal</text><line x1="236" y1="332" x2="920" y2="332" stroke="#e6ded0" stroke-width="1"/><text x="252" y="352" class="t h" font-size="10" fill="#241c10">Client Two</text><text x="252" y="366" class="t" font-size="8.5" fill="#8b7f6b">client.two@example.com</text><text x="252" y="380" class="t" font-size="8.5" fill="#8a6212">Invited — hasn’t signed in yet</text><rect x="674" y="350" width="104" height="26" rx="7" fill="#fff" stroke="#e6ded0"/><text x="726.0" y="366.24" class="t h" font-size="9" fill="#6b5f4d" text-anchor="middle">Reset password</text><rect x="786" y="350" width="118" height="26" rx="7" fill="#fff" stroke="#e8b4ae"/><text x="845.0" y="366.24" class="t h" font-size="9" fill="#96271c" text-anchor="middle">Remove from portal</text><text x="236" y="416" class="t h" font-size="7.5" fill="#8b7f6b" letter-spacing=".6">ADD EXISTING USER</text><text x="236" y="432" class="t" font-size="8.5" fill="#8b7f6b">Search by email, username, or full name — they are added as soon as you choose one.</text><rect x="236" y="440" width="684" height="26" rx="7" fill="#faf7f2" stroke="#e6ded0"/><text x="247" y="456.24" class="t" font-size="9" fill="#8b7f6b">Click to see existing portal users, or type to filter…</text><rect x="236" y="470" width="684" height="36" rx="8" fill="#faf7f2" stroke="#e6ded0"/><text x="250" y="486" class="t h" font-size="9.5" fill="#241c10">Client Three</text><text x="250" y="499" class="t" font-size="8" fill="#8b7f6b">client.three@example.com</text><text x="904" y="492" class="t h" font-size="9" fill="#2f6fb5" text-anchor="end">Add</text><text x="236" y="530" class="t" font-size="9" fill="#1d6b41">Added client.three@example.com. An access email is on its way.</text><rect x="810" y="572" width="138" height="19" rx="9.5" fill="#fff" stroke="#e6ded0"/><text x="879" y="585" class="t" font-size="8.5" fill="#8b7f6b" text-anchor="middle">illustration — not a screenshot</text></svg>
