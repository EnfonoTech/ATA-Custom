<rect x="0" y="0" width="960" height="600" fill="#faf7f2"/><rect x="0" y="0" width="960" height="34" fill="#efe8db"/><circle cx="22" cy="17" r="5.5" fill="#e0796b"/><circle cx="40" cy="17" r="5.5" fill="#e3b341"/><circle cx="58" cy="17" r="5.5" fill="#7bb87b"/><rect x="80" y="9" width="800" height="17" rx="8.5" fill="#fff" stroke="#e6ded0"/><text x="94" y="21.5" class="t" font-size="10" fill="#8b7f6b">your-erp-address/portal-app/projects/PROJ-0001</text><rect x="0" y="34" width="196" height="566" fill="#241c10"/><rect x="16" y="50" width="26" height="26" rx="6" fill="#c5a059" opacity=".9"/><text x="50" y="62" class="t h" font-size="10" fill="#fff">ATA</text><text x="50" y="73" class="t" font-size="7.5" fill="#9c8c6e">ARCHITECTS</text><text x="16" y="100" class="t h" font-size="7.5" fill="#7a6b4f" letter-spacing="1">PROJECT MANAGEMENT</text><rect x="20" y="110" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="119" class="t" font-size="10" fill="#b8ab92" font-weight="400">Dashboard</text><rect x="20" y="131" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="140" class="t" font-size="10" fill="#b8ab92" font-weight="400">Org Chart</text><rect x="8" y="148" width="180" height="19" rx="6" fill="#c5a059" opacity=".2"/><rect x="8" y="148" width="3" height="19" rx="1.5" fill="#c5a059"/><rect x="20" y="152" width="10" height="10" rx="2.5" fill="#e6c47a"/><text x="38" y="161" class="t" font-size="10" fill="#fff" font-weight="600">Projects</text><rect x="20" y="173" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="182" class="t" font-size="10" fill="#b8ab92" font-weight="400">Teams</text><rect x="20" y="194" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="203" class="t" font-size="10" fill="#b8ab92" font-weight="400">Gantt Chart</text><rect x="20" y="215" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="224" class="t" font-size="10" fill="#b8ab92" font-weight="400">Tasks</text><rect x="20" y="236" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="245" class="t" font-size="10" fill="#b8ab92" font-weight="400">Daily Task</text><rect x="20" y="257" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="266" class="t" font-size="10" fill="#b8ab92" font-weight="400">Kanban</text><rect x="20" y="278" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="287" class="t" font-size="10" fill="#b8ab92" font-weight="400">Calendar</text><rect x="20" y="299" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="308" class="t" font-size="10" fill="#b8ab92" font-weight="400">Contracts</text><text x="16" y="330" class="t h" font-size="7.5" fill="#7a6b4f" letter-spacing="1">AI</text><rect x="8" y="336" width="180" height="19" rx="6" fill="#c5a059" opacity=".12"/><text x="38" y="349" class="t h" font-size="10" fill="#e6c47a">ATA AI CHAT</text><text x="16" y="371" class="t h" font-size="7.5" fill="#7a6b4f" letter-spacing="1">FILES</text><rect x="20" y="381" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="390" class="t" font-size="10" fill="#b8ab92" font-weight="400">Files</text><rect x="20" y="402" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="411" class="t" font-size="10" fill="#b8ab92" font-weight="400">File Browser</text><rect x="20" y="423" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="432" class="t" font-size="10" fill="#b8ab92" font-weight="400">Shared</text><rect x="20" y="444" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="453" class="t" font-size="10" fill="#b8ab92" font-weight="400">Shares</text><rect x="20" y="465" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="474" class="t" font-size="10" fill="#b8ab92" font-weight="400">Routing rules</text><rect x="20" y="486" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="495" class="t" font-size="10" fill="#b8ab92" font-weight="400">File tools</text><text x="16" y="517" class="t h" font-size="7.5" fill="#7a6b4f" letter-spacing="1">ACCOUNT</text><rect x="20" y="527" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="536" class="t" font-size="10" fill="#b8ab92" font-weight="400">Profile</text><rect x="20" y="548" width="10" height="10" rx="2.5" fill="#5c5241"/><text x="38" y="557" class="t" font-size="10" fill="#b8ab92" font-weight="400">Admin</text><rect x="196" y="34" width="764" height="52" fill="#fff"/><line x1="196" y1="86" x2="960" y2="86" stroke="#e6ded0" stroke-width="1"/><rect x="216" y="49" width="250" height="22" rx="11" fill="#faf7f2" stroke="#e6ded0"/><text x="232" y="64" class="t" font-size="9" fill="#8b7f6b">Search projects, teams, tasks, documents...</text><rect x="810" y="47" width="96" height="26" rx="13" fill="#c5a059"/><text x="858" y="64" class="t h" font-size="10" fill="#fff" text-anchor="middle">+ New Project</text><circle cx="928" cy="60" r="14" fill="#7a5f2c"/><text x="928" y="64.5" class="t h" font-size="11" fill="#fff" text-anchor="middle">A</text><rect x="196" y="86" width="764" height="514" fill="#241c10" opacity=".28"/><rect x="214" y="104" width="364" height="420" rx="14" fill="#fff" stroke="#e6ded0"/><text x="236" y="138" class="t h" font-size="13.5" fill="#241c10">Invite customer portal user</text><text x="236" y="158" class="t" font-size="8.5" fill="#6b5f4d">Gives this person a portal login linked to Customer A.</text><text x="236" y="171" class="t" font-size="8.5" fill="#6b5f4d">They will see every project of that customer, and only</text><text x="236" y="184" class="t" font-size="8.5" fill="#6b5f4d">its client-submittal files. If the email already has a</text><text x="236" y="197" class="t" font-size="8.5" fill="#6b5f4d">login, that user is linked instead.</text><text x="236" y="222" class="t h" font-size="8" fill="#8b7f6b">Email (username)</text><rect x="236" y="228" width="320" height="26" rx="7" fill="#faf7f2" stroke="#e6ded0"/><text x="247" y="244.24" class="t" font-size="9" fill="#241c10">client.one@example.com</text><text x="236" y="272" class="t h" font-size="8" fill="#8b7f6b">Full name</text><rect x="236" y="278" width="320" height="26" rx="7" fill="#faf7f2" stroke="#e6ded0"/><text x="247" y="294.24" class="t" font-size="9" fill="#241c10">Client One</text><rect x="236" y="324" width="11" height="11" rx="2.5" fill="#c5a059"/><text x="241.5" y="333" class="t h" font-size="9" fill="#fff" text-anchor="middle">✓</text><text x="254" y="333.5" class="t" font-size="9.5" fill="#241c10">Send a welcome email</text><text x="254" y="348" class="t" font-size="8.2" fill="#8b7f6b">It contains a link to set their own password, then opens</text><text x="254" y="360" class="t" font-size="8.2" fill="#8b7f6b">the portal.</text><text x="236" y="384" class="t h" font-size="8" fill="#8b7f6b">Password (optional — leave blank to let them choose)</text><rect x="236" y="390" width="320" height="26" rx="7" fill="#faf7f2" stroke="#e6ded0"/><rect x="360" y="478" width="62" height="28" rx="7" fill="#fff" stroke="#e6ded0"/><text x="391.0" y="495.24" class="t h" font-size="9" fill="#6b5f4d" text-anchor="middle">Cancel</text><rect x="430" y="478" width="126" height="28" rx="7" fill="#241c10"/><text x="493.0" y="495.24" class="t h" font-size="9" fill="#fff" text-anchor="middle">Create &amp; send invite</text><rect x="596" y="104" width="344" height="350" rx="14" fill="#fff" stroke="#e6ded0"/><text x="618" y="138" class="t h" font-size="13.5" fill="#241c10">Reset password</text><text x="618" y="158" class="t" font-size="8.5" fill="#6b5f4d">For Client One (client.one@example.com)</text><circle cx="623.5" cy="189.5" r="5.5" fill="#fff" stroke="#b9ad96"/><circle cx="623.5" cy="189.5" r="3" fill="#7a5f2c"/><text x="636" y="193.5" class="t" font-size="9.5" fill="#241c10">Email them a reset link</text><text x="636" y="207" class="t" font-size="8.5" fill="#8b7f6b">They choose a new password themselves. Recommended.</text><circle cx="623.5" cy="237.5" r="5.5" fill="#fff" stroke="#b9ad96"/><text x="636" y="241.5" class="t" font-size="9.5" fill="#241c10">Set a new password now</text><text x="636" y="255" class="t" font-size="8.5" fill="#8b7f6b">Signs them out everywhere. You must pass it on.</text><text x="618" y="294" class="t h" font-size="8" fill="#8b7f6b">New password (min 8)</text><rect x="618" y="300" width="300" height="26" rx="7" fill="#faf7f2" stroke="#e6ded0"/><text x="629" y="316.06" class="t" font-size="8.5" fill="#8b7f6b">(only for Set a new password now)</text><rect x="740" y="408" width="62" height="28" rx="7" fill="#fff" stroke="#e6ded0"/><text x="771.0" y="425.24" class="t h" font-size="9" fill="#6b5f4d" text-anchor="middle">Cancel</text><rect x="810" y="408" width="108" height="28" rx="7" fill="#241c10"/><text x="864.0" y="425.24" class="t h" font-size="9" fill="#fff" text-anchor="middle">Send reset link</text><rect x="810" y="572" width="138" height="19" rx="9.5" fill="#fff" stroke="#e6ded0"/><text x="879" y="585" class="t" font-size="8.5" fill="#8b7f6b" text-anchor="middle">illustration — not a screenshot</text></svg>
