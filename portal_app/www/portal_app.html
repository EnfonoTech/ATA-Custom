<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Portal App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- This document must never be cached: it names the current content-hashed
         bundle, and a cached copy would keep loading an old build. -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    {% for href in bundle_css %}<link rel="stylesheet" crossorigin href="{{ href }}">
    {% endfor %}
</head>

<body style="margin:0;">
    <div id="app"></div>
    <script>window.csrf_token = "{{ csrf_token }}";</script>

    {% for src in bundle_js %}<script type="module" crossorigin src="{{ src }}"></script>
    {% endfor %}
</body>
</html>
